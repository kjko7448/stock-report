name: 결과 추적 (매일 오전 8:40)

on:
  schedule:
    - cron: '40 8 * * 1-5'
  workflow_dispatch:

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 라이브러리 설치
        run: pip install requests pandas yfinance

      - name: 결과 추적 업데이트 (전날 종가 기준)
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
        run: python results_tracker.py

      - name: 결과 파일 커밋
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git add predictions.csv || true
          git diff --staged --quiet || git commit -m "자동 업데이트: 결과 추적 $(date +'%Y-%m-%d')"
          git push || true
