name: 단타 오버나잇 리포트 자동 실행

on:
  schedule:
    - cron: '30 6 * * 1-5'
      timezone: 'Asia/Seoul'
  workflow_dispatch:

jobs:
  run-scalper:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 라이브러리 설치
        run: pip install requests pandas yfinance beautifulsoup4 lxml

      - name: 단타 리포트 실행
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECEIVE_ADDRESS: ${{ secrets.RECEIVE_ADDRESS }}
        run: python scalper_pro.py after
